      properties:
        taskId:
          type: string
        commentId:
          type: string
        commentAuthorName:
          type: string
        commentAuthorPhotoUri:
          type: string
          nullable: true
        taskLabel:
          type: string
      required:
        - taskId
        - commentId
        - commentAuthorName
        - taskLabel

